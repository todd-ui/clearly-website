<script>
  (function() {
    var bar = document.getElementById('mobile-app-bar');
    if (!bar) return;
    // Step aside while the footer or a full-size App Store CTA is on screen.
    var inView = new Set();
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) { e.isIntersecting ? inView.add(e.target) : inView.delete(e.target); });
        update();
      });
      // This script sits near the top of the page, so wait until the footer
      // and call-to-action panels further down actually exist.
      var watch = function() { document.querySelectorAll('footer, .blog-cta, .final-cta, .lp-pitch-cta, .contact-card').forEach(function(el) { io.observe(el); }); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
    }
    function update() {
      var show = window.scrollY > 500 && inView.size === 0;
      bar.classList.toggle('show', show);
      bar.setAttribute('aria-hidden', show ? 'false' : 'true');
      bar.querySelector('a').tabIndex = show ? 0 : -1;
    }
    window.addEventListener('scroll', update, { passive: true });
  })();
</script>
