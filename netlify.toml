# Pages are served at clean URLs (/blog, /faq, /blog/<slug>) via Netlify Pretty
# URLs; requests for the .html versions are 301ed to them by
# netlify/edge-functions/clean-urls.js. Never add a rule here that sends a
# clean URL to a .html one: the edge function would bounce it straight back.

# The whole repo is the publish directory, so keep source, scripts and
# config from being served as files.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/automation/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
