name: Quick Blog Post

# An issue created from a template with a label fires both "opened" and
# "labeled", and running on both published every post twice. Run once, when
# the 'blog' label is added (which also happens on creation).
on:
  issues:
    types: [labeled]

permissions:
  issues: write

# One post at a time across both blog workflows, so the duplicate-title check
# sees posts created by runs that started moments earlier.
concurrency:
  group: blog-generation
  cancel-in-progress: false

jobs:
  generate-post:
    if: github.event.label.name == 'blog'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd automation
          npm install

      - name: Generate blog post from subject
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cd automation
          node generate-post-from-subject.js

      - name: Comment on issue
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Blog post generated and added to Notion! It will appear on the site after the next build.'
            })

      - name: Close issue
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
